services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/realworld
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "4100:4100"
    environment:
      REACT_APP_API_URL: http://backend:3001/api
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: realworld
    ports:
      - "5432:5432"
    volumes:                                 
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d realworld"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:                                     
  postgres_data: