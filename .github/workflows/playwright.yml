name: Playwright Tests
on:
  push:
    branches: [ "main" ] 
  pull_request:
    branches: [ "main" ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    services:
      docker:
        image: docker:dind  
        options: --privileged
        #ports:
         # - 4100:4100
        #env:
        #  DOCKER_TLS_CERTDIR: ""
        #volumes:
        #  - /var/lib/docker
    
    steps:
    - uses: actions/checkout@v4 # Check out the repository
    
    - uses: actions/setup-node@v4 # Set up Node.js
      with:
        node-version: lts/*

    - name: Clone backend repo
      run: |
        cd ${{ github.workspace }}/..
        git clone https://github.com/aleksandra-krstin/node-express-realworld-example-app.git ../backend

    - name: Clone frontend repo
      run: |
        cd ${{ github.workspace }}/..
        git clone https://github.com/aleksandra-krstin/react-redux-realworld-example-app.git ../frontend

    - name: Verify directory structure
      run: ls -R ${{ github.workspace }}/..


    - name: Install dependencies
      run: npm ci  

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Start services with Docker Compose
      run: docker compose up -d --build

    - name: Wait for services to be ready
      run: |
        # Wait for the backend to be ready
        echo "Waiting for backend to be ready..."
        for i in {1..30}; do
          if curl -s -f http://localhost:3001/api/health; then
            echo "Backend is ready!"
            break
          fi
          echo "Backend not ready yet. Waiting..."
          sleep 2
        done
        # Wait for the frontend to be ready
        echo "Waiting for frontend to be ready..."
        for i in {1..30}; do
          if curl -s -f http://localhost:4100; then
            echo "Frontend is ready!"
            break
          fi
          echo "Frontend not ready yet. Waiting..."
          sleep 2
        done

    - name: Verify Docker is running          
      run: docker info

    - name: Run Playwright tests
      run: npx playwright test

    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
