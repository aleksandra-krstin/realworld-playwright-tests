name: Playwright Tests

on:
  push:
    branches: [ "main" ] 
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    services:
      docker:
        image: docker:dind
        options: --privileged

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # safer for submodules or versioned builds

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Prepare project structure
        run: |
          echo "Current workspace:"
          pwd
          echo "Moving one level up and cloning repos..."
          cd ${{ github.workspace }}/..
          rm -rf backend frontend
          git clone https://github.com/aleksandra-krstin/node-express-realworld-example-app.git backend
          git clone https://github.com/aleksandra-krstin/react-redux-realworld-example-app.git frontend
          echo "✅ Repositories cloned successfully"
          ls -R .

      - name: Verify Dockerfiles
        run: |
          cd ${{ github.workspace }}/..
          echo "Dockerfiles found:"
          find . -maxdepth 2 -type f -name Dockerfile


      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: ${{ github.workspace }}
        run: npx playwright install --with-deps

      - name: Start services with Docker Compose
        working-directory: ${{ github.workspace }}
        run: docker compose up -d --build


      - name: Wait for services to be ready
        run: |
          echo "Waiting for backend to be ready..."
          for i in {1..30}; do
            if curl -s -f http://localhost:3001/api/health; then
              echo "✅ Backend is ready!"
              break
            fi
            echo "Backend not ready yet. Waiting..."
            sleep 3
          done

          echo "Waiting for frontend to be ready..."
          for i in {1..30}; do
            if curl -s -f http://localhost:4100; then
              echo "✅ Frontend is ready!"
              break
            fi
            echo "Frontend not ready yet. Waiting..."
            sleep 3
          done


      - name: Verify Docker is running
        run: docker info

      - name: Run Playwright tests
        working-directory: ${{ github.workspace }}
        run: npx playwright test


      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
